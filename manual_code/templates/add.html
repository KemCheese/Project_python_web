{% extends "base.html" %}

{% block title %}Thêm Lời Nhắn Mới - Sổ Lưu Bút{% endblock %}

{% block content %}
<section class="card" style="max-width: 650px; margin: 0 auto;">
  <div class="card-header">
    <h1 class="card-title">Gửi Lời Nhắn Mới</h1>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">← Quay Lại</a>
  </div>

  {% if error %}
  <div class="alert-error">
    <strong>Lỗi:</strong> {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('add') }}">
    <div class="form-group">
      <label for="name" class="form-label">Tên người gửi: <span style="color: #dc2626;">*</span></label>
      <input type="text" id="name" name="name" class="form-input" 
             placeholder="Nhập tên của bạn..." 
             value="{{ name or '' }}" autofocus>
    </div>

    <div class="form-group">
      <label for="message" class="form-label">Nội dung lời nhắn: <span style="color: #dc2626;">*</span></label>
      <textarea id="message" name="message" class="form-textarea" 
                placeholder="Viết nội dung lời nhắn tại đây...">{{ message or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Gửi Lời Nhắn</button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Hủy bỏ</a>
    </div>
  </form>
</section>
{% endblock %}
